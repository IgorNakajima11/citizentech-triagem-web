services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    volumes:
      - dados:/dados
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  dados:
